<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nedaa ❤️</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: sans-serif;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* PASSWORD */
#lockScreen {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
}
#lockScreen h2 { color: white; }

/* CARD */
.card {
  width: 360px;
  height: 540px;
  perspective: 1000px;
}

.inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: 1s;
}

.card.open .inner {
  transform: rotateY(180deg);
}

/* faces */
.face {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  backface-visibility: hidden;
  overflow: hidden;
}

/* front */
.front {
  background: #8b05d8;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
}

/* back */
.back {
  transform: rotateY(180deg);
  background: linear-gradient(135deg,#ffaaea,#e6429c);
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* image */
.card img {
  width: 100%;
  height: auto;
  max-height: 50%;
  object-fit: contain;
  border-radius: 15px;
  margin-bottom: 10px;
}

/* video */
.card video {
  width: 100%;
  max-height: 50%;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 10px;
  opacity: 0;
  transition: opacity 1s ease;
}

/* text */
.text {
  color: rgb(141, 24, 24);
  text-align: center;
  line-height: 1.8;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(0,0,0,0.6);
  overflow-y: auto;
  max-height: 45%;
  padding-right: 5px;
}

/* scrollbar */
.text::-webkit-scrollbar {
  width: 4px;
}
.text::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.5);
  border-radius: 10px;
}

/* controls */
.controls {
  position: absolute;
  bottom: 20px;
}
button {
  padding: 10px 20px;
  margin: 5px;
  border-radius: 10px;
  border: none;
}

/* hearts */
.heart {
  position: fixed;
  color: red;
  animation: floatUp 5s linear infinite;
}
@keyframes floatUp {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh); opacity: 0;}
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bgMusic" src="song.mp3" loop></audio>

<!-- PASSWORD -->
<div id="lockScreen">
  <h2>Enter ur birthday يعسولي ودلوعي 🎂</h2>
  <input type="password" id="passInput">
  <button onclick="checkPass()">Open ❤️</button>
</div>

<!-- CARD -->
<div class="card" id="card">
  <div class="inner">
    
    <div class="face front">
      اضغط بس اضغط براحه 😉❤️
    </div>

    <div class="face back">
      <img id="cardImg" src="jpg1.jpeg">
      
      <video id="cardVideo" style="display:none;" autoplay muted loop playsinline>
        <source src="vid4.mp4" type="video/mp4">
      </video>

      <div class="text" id="text"></div>
    </div>

  </div>
</div>

<!-- controls -->
<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="next()">➡️</button>
</div>

<script>
const PASSWORD = "352003";

const messages = [
"كل سنه وانت طيبه يا يعشق روحي ❤️",

"افتكرت اول عيد ميلاد ليك واحنا لسه صحاب كانت اول مره اجيب فيها هديه لحد عزيز عليا او افكر في ايه يبسطه ويفرحه دايما ليك لحظه سبيشال في كل حياتي ليك احساس مختلف عن اي حد في حياتي او كان موجود فيها وحقيقي بجد حتي وجودك كصاحب فيها في البدايه كان فارق اوي من يوم ما قربنا وانا دايما حاجه بتشدني ليك بتطمني بجد بالمعني الحرفي للكلمة الحمدلله بجد ربنا رزقني بيك علشان تقر عيني بيك ❤️",

"كل سنه وانت معايا كل سنه وانت حبيبي كل سنه وانت حبي الاول والاخير كل سنه وانت الحبيب والصحاب والاهل والبيت كل سنه وانت طيبه ينونتاي كل سنه وانت طيبه ينونتي كل سنه وانت طيبه ينونو ويارب كل سنه وانت في حضني ويارب يارب كل سنه وانت مراتي وحبيبتي وروحي وام عيالي يارب ويارب ويارب يارب تبقي كل سنه واحنا في بيتنا انا وانت بنحتفل لوحدنا مبسوطين وفرحانين بجد اننا خلاص وصلنا خلاص بقينا سوا بجد بحبك وعايز اقولك انت الوحيد اللي اعمل علشانه حاجات عمري ما كنت متخيل اعملها انت الوحيد اللي لو طلبت روحي ترخصلك وتفداك كل سنه يحبيب روحي❤️",

"LIKE THE SHARK LOVE THE BLOOD ❤️"
];

const images = [
"jpg1.jpeg",
"jpg2.jpeg",
"jpg3.jpeg"
];

let index = 0;
let card = document.getElementById("card");
let textEl = document.getElementById("text");
let img = document.getElementById("cardImg");
let vid = document.getElementById("cardVideo");
let music = document.getElementById("bgMusic");

/* password */
function checkPass() {
  if (document.getElementById("passInput").value === PASSWORD) {
    document.getElementById("lockScreen").style.display = "none";
    music.play();
  } else {
    alert("غلط 😅");
  }
}

/* typing */
function typeText(text) {
  textEl.innerHTML = "";
  let i = 0;
  function t() {
    if (i < text.length) {
      textEl.innerHTML += text[i++];
      setTimeout(t, 20);
    }
  }
  t();
}

/* media control */
function updateMedia() {
  if (index === messages.length - 1) {
    img.style.display = "none";
    vid.style.display = "block";
    vid.currentTime = 0;
    vid.play();

    setTimeout(() => {
      vid.style.opacity = "1";
    }, 50);

  } else {
    vid.style.opacity = "0";
    vid.style.display = "none";

    img.style.display = "block";
    img.src = images[index];
  }
}

/* open */
card.onclick = () => {
  card.classList.add("open");
  typeText(messages[index]);
  updateMedia();
};

/* next */
function next() {
  card.classList.remove("open");

  setTimeout(() => {
    index = (index + 1) % messages.length;
    card.classList.add("open");
    typeText(messages[index]);
    updateMedia();
  }, 500);
}

/* prev */
function prev() {
  card.classList.remove("open");

  setTimeout(() => {
    index = (index - 1 + messages.length) % messages.length;
    card.classList.add("open");
    typeText(messages[index]);
    updateMedia();
  }, 500);
}

/* hearts */
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random()*100 + "vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
},300);
</script>

</body>
</html>
